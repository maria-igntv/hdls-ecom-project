name: hdls-stage2

x-api: &api
  image: hdls-commerce:stage2
  build: ../../backend/commerce
  environment:
    SPRING_PROFILES_ACTIVE: demo
    DB_URL: jdbc:postgresql://postgres:5432/commerce
    DB_USER: commerce
    DB_PASSWORD: demo-database-only
    REDIS_HOST: redis
    JAVA_TOOL_OPTIONS: "-Xmx256m -XX:ActiveProcessorCount=2"
  mem_limit: 512m
  cpus: 1
  stop_grace_period: 20s
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: demo-database-only
      POSTGRES_DB: commerce
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=80", "-c", "log_lock_waits=on", "-c", "deadlock_timeout=200ms"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 768m
    cpus: 2
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    mem_limit: 128m
    cpus: 0.5
  commerce-1:
    <<: *api
    ports:
      - "127.0.0.1:18081:8080"
  commerce-2:
    <<: *api
    ports:
      - "127.0.0.1:18082:8080"
  haproxy:
    image: haproxy:3.2-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      - commerce-1
      - commerce-2
    mem_limit: 128m
    cpus: 0.5

volumes:
  postgres-data:
