global
    log stdout format raw local0
    maxconn 2000
defaults
    log global
    mode http
    timeout connect 1s
    timeout client 30s
    timeout server 25s
    timeout queue 15s
    timeout check 1s
    retries 0
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s
frontend api
    bind :8080
    default_backend commerce
backend commerce
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host commerce
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 maxconn 32 resolvers docker init-addr last,libc,none
    server c1 commerce-1:8080 check
    server c2 commerce-2:8080 check
