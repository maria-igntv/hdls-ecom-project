rule_files: [/etc/prometheus/alerts.yaml]
evaluation_interval: 10s
tests:
  - interval: 10s
    input_series:
      - series: 'http_server_requests_seconds_bucket{role="commerce",uri="/api/products",le="0.2"}'
        values: '0+50x40'
      - series: 'http_server_requests_seconds_bucket{role="commerce",uri="/api/products",le="1"}'
        values: '0+100x40'
      - series: 'http_server_requests_seconds_bucket{role="commerce",uri="/api/products",le="+Inf"}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 120s
        alertname: ApiLatencyHigh
        exp_alerts: []
      - eval_time: 130s
        alertname: ApiLatencyHigh
        exp_alerts:
          - exp_labels: {role: commerce, severity: warning}
            exp_annotations: {summary: 'HTTP p95 приложения превышает SLO', runbook: 'docs/runbooks.md#api'}
  - interval: 10s
    input_series:
      - series: 'ecom_expired_reservations{instance="worker"}'
        values: '0+0x5 1+0x8 0+0x4'
    alert_rule_test:
      - eval_time: 110s
        alertname: ReservationExpiryDelayed
        exp_alerts: []
      - eval_time: 120s
        alertname: ReservationExpiryDelayed
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: 'Резервы просрочены более 10 с', runbook: 'docs/runbooks.md#worker'}
      - eval_time: 150s
        alertname: ReservationExpiryDelayed
        exp_alerts: []
  - interval: 10s
    input_series:
      - series: 'up{instance="c1",job="java"}'
        values: '1+0x2 0+0x5 1+0x5'
    alert_rule_test:
      - eval_time: 50s
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 60s
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {instance: c1, job: java, severity: critical}
            exp_annotations: {summary: 'Не удаётся собрать метрики компонента', runbook: 'docs/runbooks.md#dependency'}
      - eval_time: 100s
        alertname: TargetDown
        exp_alerts: []
  - interval: 10s
    input_series:
      - series: 'ecom_outbox_oldest_seconds{instance="worker"}'
        values: '0+0x5 70+0x8'
    alert_rule_test:
      - eval_time: 80s
        alertname: OutboxLag
        exp_alerts: []
      - eval_time: 90s
        alertname: OutboxLag
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: 'Outbox старше минуты', runbook: 'docs/runbooks.md#broker'}
  - interval: 10s
    input_series:
      - series: 'http_server_requests_seconds_count{role="commerce",uri="/api/orders",status="201"}'
        values: '0+90x30'
      - series: 'http_server_requests_seconds_count{role="commerce",uri="/api/orders",status="503"}'
        values: '0+10x30'
      - series: 'http_server_requests_seconds_count{role="commerce",uri="/api/orders",status="401"}'
        values: '0+1000x30'
    alert_rule_test:
      - eval_time: 90s
        alertname: ApiErrorBudgetBurn
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: 'API расходует error budget быстрее 14.4x', runbook: 'docs/runbooks.md#api'}
