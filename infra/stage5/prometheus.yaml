global:
  scrape_interval: 10s
  evaluation_interval: 10s
rule_files: [/etc/prometheus/alerts.yaml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [commerce-1:9091, commerce-2:9091]
        labels: {role: commerce}
      - targets: [worker-1:9091, worker-2:9091]
        labels: {role: worker}
      - targets: [search:9091]
        labels: {role: search}
      - targets: [provider:9091]
        labels: {role: provider}
  - job_name: postgres
    static_configs: [{targets: [pg-exporter:9187]}]
  - job_name: redis
    static_configs: [{targets: [redis-exporter:9121]}]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs: [{targets: [rabbitmq:15692]}]
  - job_name: gateway
    static_configs: [{targets: [haproxy:8404]}]
  - job_name: garage
    bearer_token: local-garage-metrics
    static_configs: [{targets: [garage:3903]}]
  - job_name: tempo
    static_configs: [{targets: [tempo:3200]}]
  - job_name: probe
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: [http://haproxy:8080/readyz, http://search:8080/readyz, http://provider:8080/livez, http://garage:3903/health]
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'blackbox:9115'}
  - job_name: opensearch
    static_configs: [{targets: [os-exporter:9116]}]
