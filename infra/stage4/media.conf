proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:4m max_size=128m inactive=1d;
server {
    listen 8080;
    location / {
        limit_except GET HEAD { deny all; }
        proxy_pass http://garage:3902;
        proxy_set_header Host product-images.web.garage.localhost;
        proxy_cache media;
        proxy_cache_valid 200 1d;
        proxy_cache_lock on;
        add_header X-Media-Cache $upstream_cache_status;
        add_header X-Content-Type-Options nosniff always;
    }
}
