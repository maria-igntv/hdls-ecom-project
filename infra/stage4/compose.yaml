name: hdls-stage4

x-environment: &environment
  SPRING_PROFILES_ACTIVE: demo
  DB_URL: jdbc:postgresql://postgres:5432/commerce
  DB_USER: commerce
  DB_PASSWORD: demo-database-only
  DB_POOL_WAIT_MS: 1000
  DB_INIT_SQL: "SET statement_timeout='2s'; SET lock_timeout='500ms'; SET idle_in_transaction_session_timeout='5s'"
  REDIS_HOST: redis
  CACHE_ORIGIN_WAIT_MS: 500
  RABBIT_HOST: rabbitmq
  SEARCH_URL: http://opensearch:9200
  PAYMENT_URL: http://provider:8080
  S3_ENDPOINT: http://garage:3900
  S3_ACCESS_KEY: GK000000000000000000000000
  S3_SECRET_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
  MEDIA_PUBLIC_BASE: http://localhost:18086
  JAVA_TOOL_OPTIONS: -Xmx256m -XX:ActiveProcessorCount=1 -XX:+UseG1GC

x-api: &api
  image: hdls-commerce:stage4
  build: ../../backend/commerce
  environment: *environment
  mem_limit: 640m
  cpus: 1
  stop_grace_period: 20s
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}

x-worker: &worker
  <<: *api
  environment:
    <<: *environment
    SPRING_PROFILES_ACTIVE: demo,worker
  restart: on-failure
  mem_limit: 512m

services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: commerce, POSTGRES_PASSWORD: demo-database-only, POSTGRES_DB: commerce}
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=80, -c, log_lock_waits=on, -c, deadlock_timeout=200ms]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U commerce -d commerce]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 768m
    cpus: 2
  redis:
    image: redis:7.4-alpine
    command: [redis-server, --maxmemory, 64mb, --maxmemory-policy, allkeys-lru, --save, "", --appendonly, "no"]
    mem_limit: 128m
    cpus: 0.5
  commerce-1:
    <<: *api
    ports: [127.0.0.1:18081:8080]
  commerce-2:
    <<: *api
    ports: [127.0.0.1:18082:8080]
  worker-1: *worker
  worker-2: *worker
  provider:
    image: hdls-provider:stage4
    build: ../../backend/provider
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/commerce?currentSchema=provider
      DB_PASSWORD: demo-database-only
      JAVA_TOOL_OPTIONS: -Xmx128m -XX:ActiveProcessorCount=1
    ports: [127.0.0.1:18087:8080]
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 384m
    cpus: 0.5
  search:
    image: hdls-search:stage4
    build: ../../backend/search
    environment:
      SEARCH_URL: http://opensearch:9200
      JAVA_TOOL_OPTIONS: -Xmx128m -XX:ActiveProcessorCount=1
    ports: [127.0.0.1:18085:8080]
    mem_limit: 384m
    cpus: 0.75
  opensearch:
    image: opensearchproject/opensearch:3.3.2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m -XX:ActiveProcessorCount=2
    volumes: [search-data:/usr/share/opensearch/data]
    ports: [127.0.0.1:19200:9200]
    mem_limit: 1280m
    cpus: 2
  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: commerce
      RABBITMQ_DEFAULT_PASS: local-rabbit-password
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: +S 2:2
    volumes: [rabbit-data:/var/lib/rabbitmq]
    ports: [127.0.0.1:15672:15672]
    mem_limit: 512m
    cpus: 1
  garage:
    image: dxflrs/garage:v2.1.0
    command: [/garage, server]
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports: [127.0.0.1:13900:3900]
    mem_limit: 256m
    cpus: 0.5
  media:
    image: nginx:1.29-alpine
    volumes: [./media.conf:/etc/nginx/conf.d/default.conf:ro]
    ports: [127.0.0.1:18086:8080]
    depends_on: [garage]
    mem_limit: 64m
    cpus: 0.25
  haproxy:
    image: haproxy:3.2-alpine
    volumes: [./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro]
    ports: [127.0.0.1:18080:8080, 127.0.0.1:18084:9999]
    depends_on: [commerce-1, commerce-2, search]
    mem_limit: 128m
    cpus: 0.5
  k6:
    image: grafana/k6:1.4.2
    profiles: [load]
    user: "${LOAD_UID:-1000}:${LOAD_GID:-1000}"
    volumes:
      - ../../scripts/load_stage4.js:/scripts/load.js:ro
      - ../../model/capacity.json:/scripts/capacity.json:ro
      - ${LOAD_RESULTS_DIR:-../../artifacts/stage4}:/results
    environment:
      BASE_URL: http://haproxy:8080
    mem_limit: 1536m
    cpus: 2

volumes:
  postgres-data:
  search-data:
  rabbit-data:
  garage-meta:
  garage-data:
