global
    log stdout format raw local0
    maxconn 2000
    hard-stop-after 15s

defaults
    log global
    mode http
    option httplog
    option http-keep-alive
    timeout http-request 5s
    timeout connect 300ms
    timeout queue 100ms
    timeout client 15s
    timeout server 2s
    timeout check 1s
    retries 0

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 1s

frontend api
    bind :8080
    http-request set-header X-Request-ID %[uuid()]
    acl search_path path /api/search
    acl search_prefix path_beg /api/search/
    acl upload_path path /api/admin/images
    acl upload_prefix path_beg /api/admin/images/
    use_backend search if search_path
    use_backend search if search_prefix
    use_backend uploads if upload_path
    use_backend uploads if upload_prefix
    default_backend commerce

backend commerce
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host backend
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 maxconn 32 resolvers docker init-addr last,libc,none
    server commerce_1 commerce-1:8080 check
    server commerce_2 commerce-2:8080 check

backend search
    balance roundrobin
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host backend
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 maxconn 16 resolvers docker init-addr last,libc,none
    server search_1 search-1:8080 check

backend uploads
    balance roundrobin
    timeout server 30s
    option httpchk
    http-check send meth GET uri /readyz ver HTTP/1.1 hdr Host backend
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 maxconn 4 resolvers docker init-addr last,libc,none
    server commerce_1 commerce-1:8080 check
    server commerce_2 commerce-2:8080 check

listen stats
    bind :8404
    stats enable
    stats uri /stats
